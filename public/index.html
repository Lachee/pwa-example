<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My App</title>
  <link rel="manifest" href="manifest.json"/>
  <style>
    body{
        padding: 0;
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }
    .toolbar{
        display: flex;
        flex-direction: row;
        gap: 10px;
        background: #0a6b24;
        padding: 5px;
    }
    .content{
        flex: 1;
        padding: 5px;
    }
  </style>
</head>
<body>
<div class="toolbar">
  <button id="connect">Connect</button>
  <button id="disconnect">Disconnect</button>
  <button id="feed">Feed</button>
  <button id="print">Print</button>
  <progress id="progress" value="0" max="100"></progress>
  <input type="file" accept="image/*" id="input_image">
</div>
<div class="content">
  <canvas id="canvas" width="384"></canvas>
</div>
</body>
<script src="app.js" type="module"></script>
</html>
